name: Bug report
description: Report a problem with rustermux
body:
  - type: textarea
    attributes:
      label: Problem and steps to reproduce
      description: Include what you expected, what happened, and relevant logs.
    validations:
      required: true
  - type: input
    attributes:
      label: Rustermux version, Android version, and device model
    validations:
      required: true
