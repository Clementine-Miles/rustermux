import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id "com.android.application"
}

def bootstrapDirectory = layout.buildDirectory.dir("generated/bootstrap").get().asFile

android {
    namespace "com.termux"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = project.properties.ndkVersion

    dependencies {
        implementation "androidx.annotation:annotation:1.9.0"
        implementation "androidx.appcompat:appcompat:1.6.1"
        implementation "androidx.core:core:1.13.1"

        implementation project(":terminal-view")
        implementation project(":termux-shared")
    }

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 118
        versionName "0.118.0"

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.termux"

        externalNativeBuild {
            ndkBuild {
                arguments "TERMUX_BOOTSTRAP_DIR=${bootstrapDirectory.absolutePath}"
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        ndk {
            abiFilters rootProject.androidNativeAbi.name
        }
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

}

dependencies {
    implementation "androidx.biometric:biometric:1.2.0-alpha05"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "androidx.media:media:1.7.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$desugarJdkLibsVersion"
}

def bootstrapArch = rootProject.androidNativeAbi.bootstrapArch
def bootstrapArchive = new File(bootstrapDirectory, "bootstrap-${bootstrapArch}.zip")
def bootstrapAssemblyInclude = new File(bootstrapDirectory, "termux-bootstrap-archive.inc")
def bootstrapChecksum = "ea2aeba8819e517db711f8c32369e89e7c52cee73e07930ff91185e1ab93f4f3"
def bootstrapRelease = "2026.02.12-r1%2Bapt.android-7"

def sha256(File file) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    file.withInputStream { input ->
        def buffer = new byte[8192]
        int count
        while ((count = input.read(buffer)) != -1) {
            digest.update(buffer, 0, count)
        }
    }
    return digest.digest().encodeHex().toString()
}

def downloadBootstrap = tasks.register("downloadBootstrap") {
    doLast {
        bootstrapDirectory.mkdirs()
        if (!bootstrapArchive.isFile() || sha256(bootstrapArchive) != bootstrapChecksum) {
            def source = new URL("https://github.com/termux/termux-packages/releases/download/bootstrap-${bootstrapRelease}/${bootstrapArchive.name}")
            logger.lifecycle("Downloading ${source}")
            def temporary = Files.createTempFile(bootstrapDirectory.toPath(), "download-", ".zip")
            try {
                def connection = source.openConnection()
                connection.connectTimeout = 15_000
                connection.readTimeout = 60_000
                connection.inputStream.withCloseable { input ->
                    Files.copy(input, temporary, StandardCopyOption.REPLACE_EXISTING)
                }
                def actualChecksum = sha256(temporary.toFile())
                if (actualChecksum != bootstrapChecksum) {
                    throw new GradleException("Wrong checksum for ${source}: expected ${bootstrapChecksum}, got ${actualChecksum}")
                }
                Files.move(temporary, bootstrapArchive.toPath(), StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING)
            } finally {
                Files.deleteIfExists(temporary)
            }
        }

        // The assembler doesn't report .incbin files as dependencies. Include a
        // digest-bearing preprocessor file so archive changes rebuild the ELF.
        def definition = "#define TERMUX_BOOTSTRAP_ARCHIVE \"${bootstrapArchive.name}\" /* ${bootstrapChecksum} */\n"
        if (!bootstrapAssemblyInclude.exists() || bootstrapAssemblyInclude.text != definition) {
            bootstrapAssemblyInclude.text = definition
        }
    }
}

tasks.configureEach {
    if (name.startsWith("configureNdkBuild") || name.startsWith("buildNdkBuild")) {
        dependsOn(downloadBootstrap)
    }
}

apply from: "termux-api.gradle"
