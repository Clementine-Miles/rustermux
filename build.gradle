buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
    }
}

ext.androidNativeAbi = [name: "arm64-v8a", target: "aarch64-linux-android", bootstrapArch: "aarch64"]

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
