buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
    }
}

ext.androidNativeAbi = [name: "arm64-v8a", target: "aarch64-linux-android", bootstrapArch: "aarch64"]

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects { module ->
    ["com.android.application", "com.android.library"].each { pluginId ->
        module.pluginManager.withPlugin(pluginId) {
            def components = module.extensions.getByName("androidComponents")
            components.beforeVariants(components.selector().withBuildType("debug")) { variant ->
                variant.enable = false
            }
        }
    }
}
